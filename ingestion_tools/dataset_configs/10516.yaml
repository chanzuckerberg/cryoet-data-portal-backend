datasets:
- metadata:
    assay:
      id: EFO:0002909
      name: microscopy assay
    authors: *id001
    cell_component:
      id: GO:0043196
      name: varicosity
    cell_type:
      id: CL:1001451
      name: sensory neuron of dorsal root ganglion
    cross_references:
      publications: 10.64898/2026.07.07.737043
      related_database_links: https://doi.org/10.5281/zenodo.16927937
    dataset_description: Cryo-electron tomography of intact, unmilled peripheral axons and their varicosities
      in primary dorsal root ganglion neurons dissociated from 3-month-old mice and cultured for 48 h
      on gold Quantifoil grids. The axons grow thin enough over the grid surface to be imaged directly,
      with no cryo-sectioning and no focused-ion-beam milling, so the varicosities (roughly 0.6-1.9 microns
      across) and the much narrower shafts connecting them are captured in a near-native state. Tilt series
      were collected from -51 to +51 degrees in 3 degree increments on a Titan Krios operated at 300 kV,
      equipped with a Gatan energy filter and a K2 Summit direct electron detector. Tomograms were reconstructed
      by weighted back-projection in IMOD and denoised by IsoNet deconvolution. This dataset holds 21
      tomograms from the 31 July - 1 August 2025 acquisition session, 17 of which carry a manually curated
      multi-class organelle segmentation covering the plasma membrane, microtubules, mitochondrial outer
      and inner membranes, endoplasmic reticulum and vesicles enclosed within it, multivesicular bodies,
      multilamellar vesicles, endosomes, phagophores and free cytoplasmic vesicles. The study uses these
      to ask how the spatial confinement of an axon constrains organelle architecture. Across the whole
      study 192 tomograms were reconstructed and the 107 highest in quality were segmented; this deposition
      carries that segmented subset, split by acquisition session.
    dataset_identifier: 10516
    dataset_title: Cryo-electron tomography of axons and varicosities in cultured primary mouse dorsal
      root ganglion neurons (Titan Krios, 31 July - 1 August 2025)
    dates: *id002
    development_stage:
      id: MmusDv:0000063
      name: 3-month-old stage
    disease:
      id: PATO:0000461
      name: normal
    funding:
    - funding_agency_name: National Institutes of Health (NIH)
      grant_id: R21AG090967
    - funding_agency_name: National Institutes of Health (NIH) Office of the Director
      grant_id: 1S10OD032204
    - funding_agency_name: Collins Medical Trust
      grant_id: null
    - funding_agency_name: William Wheless III Professorship
      grant_id: null
    grid_preparation: Gold Quantifoil 2/2 grids (2 micron holes spaced 2 microns apart), with either a
      silicon dioxide or a carbon support film, were glow discharged and then coated overnight at 4 degrees
      C with poly-L-lysine in 35 mm MatTek dishes, four grids per dish, resting on the plastic surrounding
      the coverslip depression so they could later be lifted by their edge with forceps. Grids were washed
      with sterile water, briefly air dried, coated with laminin for 2 h at 4 degrees C, and transferred
      into complete F-12 medium before neurons were plated. After 48 h in culture the grids were vitrified
      on a manual blotter kept at room temperature immediately beside the incubator, so that each grid
      spent as little time as possible below 37 degrees C; the four grids in a dish were processed sequentially
      over about two minutes. Each grid received 4 microlitres of BSA-coated 10 nm colloidal gold fiducials
      in F-12 medium, was blotted from behind with Whatman 1M filter paper for 3-5 s, and was plunged
      into liquid ethane cooled by liquid nitrogen. Grids were stored under liquid nitrogen and clipped
      into cartridges immediately before imaging.
    organism:
      name: Mus musculus
      taxonomy_id: 10090
    other_setup: Plunge freezing of intact cultured neurons on EM grids
    sample_preparation: Dorsal root ganglia were dissected from the cervical to thoracic spinal levels
      of three separate 3-month-old mice, euthanized by decapitation following terminal anesthesia under
      protocols approved by the Animal Care Committee at UTHealth Houston. Ganglia were digested with
      papain for 20 min at 37 degrees C, collected by centrifugation, then digested with collagenase/dispase
      for a further 20 min at 37 degrees C. The pellet was triturated with a fire-polished glass pipette
      pre-coated with complete F-12 medium containing serum, and the dissociated cells were purified by
      centrifugation through a 20 percent Percoll cushion. Cells were resuspended in complete F-12 medium,
      counted, and re-concentrated so that approximately 5,000 live neurons were delivered onto each EM
      grid. Neurons were plated directly onto grids incubating in complete F-12 medium and grown for 48
      h at 37 degrees C in 5 percent CO2, by which time thin peripheral axons and their varicosities had
      extended across the grid surface. Cells were vitrified alive and intact, with no fixation, staining,
      cryo-sectioning or focused-ion-beam milling at any stage. Mouse strain and sex are not reported
      in the source publication.
    sample_type: primary_cell_culture
    tissue:
      id: UBERON:0000044
      name: dorsal root ganglion
