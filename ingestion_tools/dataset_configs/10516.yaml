annotations:
- metadata:
    annotation_ingest_id: mitochondrial-outer-membrane-1
    annotation_method: Membrane voxels were pre-segmented with the deep-learning tool MemBrain-seg using
      its default parameters, and microtubule voxels with the deep-learning model TARDIS-MT. Both outputs
      were imported as separate label fields into Amira, where they were manually curated and assigned
      to semantic organelle classes using threshold-based selection and the 3D magic-wand tool. Conservative
      morphological criteria were defined for each class and applied consistently across every tomogram.
      Segmentation was carried out on the 4x-binned tomograms after denoising by IsoNet deconvolution,
      and the 107 tomograms judged highest in quality out of 192 reconstructions were segmented. Completed
      segmentations were exported as multi-label MRC2014 volumes.
    annotation_object:
      id: GO:0005741
      name: mitochondrial outer membrane
    annotation_publications: 10.64898/2026.07.07.737043, 10.1101/2024.01.05.574336, 10.1101/2024.12.19.629196
    annotation_software: MemBrain-seg, TARDIS-MT, IsoNet, Amira
