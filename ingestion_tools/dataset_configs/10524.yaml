datasets:
- metadata:
    dataset_identifier: 10524
    dataset_title: Cryo-FIB-milled NIH/3T3 mouse fibroblasts (dataset 4)
    dataset_description: Cryo-electron tomograms of intact NIH/3T3 mouse fibroblasts thinned into lamellae
      by cryo-focused-ion-beam milling, capturing the nuclear envelope and the surrounding cytoplasmic
      and nucleoplasmic environment in a near-native state. The nuclear pore complexes in these tomograms
      contributed to a subtomogram-averaged map of the mammalian nuclear pore and its nuclear basket.
    authors: &id001
