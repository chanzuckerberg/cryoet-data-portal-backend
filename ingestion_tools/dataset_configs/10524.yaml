    grid_preparation: Cells were seeded on glow-discharged, fibronectin-coated Quantifoil R1/4 200-mesh
      gold grids, back-blotted by hand to remove excess medium, and plunge-frozen in a 50/50 ethane-propane
      mixture with a custom-built vitrification device. Vitrified grids were clipped into slotted AutoGrids
      and thinned into lamellae by cryo-focused-ion-beam milling at shallow grazing angles on an Aquilos
      dual-beam instrument.
    sample_preparation: NIH/3T3 mouse embryonic fibroblasts (ATCC CRL-1658) were grown at 37 C in 5% CO2
      in Dulbecco's Modified Eagle Medium with fetal calf serum, then seeded onto EM grids and cultured
      for a further two hours so the cells adhered stably to the support film.
    other_setup: Cryo-FIB milling
