depositions:
- metadata:
    deposition_identifier: 10365
    deposition_title: In situ cryo-electron tomography of the nuclear pore complex in NIH/3T3 fibroblasts
    deposition_description: Cryo-electron tomograms of cryo-FIB-milled lamellae through intact, plunge-frozen
      NIH/3T3 mouse fibroblasts, collected across three acquisition sessions and capturing the nuclear
      envelope in a near-native state. The nuclear pore complexes in these tomograms supported a subtomogram-averaged
      map of the mammalian nuclear pore and the molecular architecture of its nuclear basket.
    deposition_types:
    - dataset
    - annotation
