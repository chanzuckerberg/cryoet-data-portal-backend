depositions:
- metadata:
    authors: *id001
    cross_references:
      publications: 10.64898/2026.07.07.737043
      related_database_links: https://doi.org/10.5281/zenodo.16927937
    dates: *id002
    deposition_description: Refined organelle segmentations for the subset of axonal varicosity tomograms
      carried forward into the manuscript. Fifteen tomograms were re-reconstructed at 2x binning (10.8
      A/voxel) and IsoNet-denoised, then re-annotated in Amira into the 16-class scheme described in the
      manuscript, following MemBrain-seg and TARDIS-MT pre-segmentation. Eleven of the fifteen are re-annotations
      of tomograms already present in deposition 10362 under its earlier 15-class iteration; the remaining
      four are tomograms from the same acquisition sessions that were not previously deposited. The tomograms
      and denoised volumes themselves belong to deposition 10362; this deposition carries only the refined
      annotations, which supersede the baseline set wherever the two cover the same run.
    deposition_identifier: 10366
    deposition_title: Refined organelle segmentations of axonal varicosity tomograms following the manuscript
      class scheme
    deposition_types:
    - annotation
