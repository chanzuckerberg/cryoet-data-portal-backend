datasets:
- metadata:
    dataset_identifier: 10529
    dataset_title: Cryo-electron tomography of a cryo-FIB lift-out from adult mouse hippocampal CA1 stratum
      radiatum (dataset 6)
    dataset_description: This dataset contains in situ cryo-electron tomography of vitreous adult mouse
      (C57BL/6J) hippocampal tissue targeting the stratum radiatum of the CA1 field. A 100 um sagittal
      slice from the left hemisphere of a 184-day-old male mouse was high-pressure frozen after a 20 min
      incubation with a cryoprotectant of 10% dextran, 5% sucrose and 5% ethylene glycol in artificial
      CSF, screened by cryo-fluorescence/cryo-confocal microscopy, and the CA1 stratum radiatum was targeted
      by plasma focused-ion-beam (PFIB) milling using the fluorescence of the neighbouring pyramidal cell
      layer as a landmark. Serial cryo-lift-out sections were welded onto TEM support grids and thinned
      to ~150-300 nm lamellae, sampling the synapse-rich neuropil between stratum pyramidale and stratum
      lacunosum-moleculare where Schaffer collateral synapses, apical dendrites and their cytoskeleton
      are found. Tilt series were acquired on a Titan Krios G4 (300 kV) with a Selectris energy filter
      and Falcon 4i detector.
    authors:
    - name: Calina Glynn
      ORCID: 0000-0002-2197-2357
      affiliation_name: The Rosalind Franklin Institute
      primary_author_status: true
    - name: Jake L.R. Smith
      ORCID: 0000-0003-3234-6228
      affiliation_name: The Rosalind Franklin Institute
      primary_author_status: true
    - name: Matthew Case
      ORCID: 0000-0002-4635-6454
      affiliation_name: The Rosalind Franklin Institute
    - name: Rebecca Csöndör
      ORCID: 0000-0003-1015-8656
      affiliation_name: The Rosalind Franklin Institute
    - name: Ana Katsini
      ORCID: 0009-0008-2659-9230
      affiliation_name: The Rosalind Franklin Institute
    - name: Maria E. Sanita
      ORCID: 0009-0002-0520-5606
      affiliation_name: The Rosalind Franklin Institute
    - name: Thomas S. Glen
      ORCID: 0000-0001-9357-1256
      affiliation_name: The Rosalind Franklin Institute
    - name: Avery Pennington
      ORCID: 0000-0002-1179-4243
      affiliation_name: The Rosalind Franklin Institute
    - name: Michael Grange
      ORCID: 0000-0003-2580-2299
      affiliation_name: The Rosalind Franklin Institute
      email: michael.grange@rfi.ac.uk
      corresponding_author_status: true
    dates: *id002
    sample_type: tissue
    organism:
      name: Mus musculus
      taxonomy_id: 10090
    tissue:
      name: CA1 stratum radiatum
      id: UBERON:0014554
    cell_strain:
      name: C57BL/6J
    assay:
      name: microscopy assay
      id: EFO:0002909
    development_stage:
      name: prime adult stage
      id: MmusDv:0000136
    disease:
      name: normal
      id: PATO:0000461
    funding:
    - funding_agency_name: Wellcome Trust
      grant_id: 225902/Z/22/Z
    - funding_agency_name: Wellcome Trust
      grant_id: 226810/Z/22/Z
    - funding_agency_name: Wellcome Trust
      grant_id: 220526/Z/20/Z
    - funding_agency_name: Engineering and Physical Sciences Research Council
    - funding_agency_name: UK Research and Innovation
    grid_preparation: Cryogenic serial lift-out in a perpendicular geometry by plasma focused-ion-beam
      (PFIB) milling. High-pressure-frozen tissue carriers were screened by cryo-confocal fluorescence
      microscopy (Leica Stellaris 8, HC PL APO 50x/0.9-NA, LAS X) and loaded orientation-consciously into
      a Thermo Fisher Helios G5 Hydra CX PFIB/SEM on a 27 degree pre-tilted shuttle. Five milled fiducial
      markers (75 x 4 x 3 um, 60 nA Xe plasma) enabled correlation with fluorescence tilesets acquired
      on an integrated Meteor (Delmic) microscope (20x/0.45, Odemis); CA1 stratum radiatum targets were
      placed up to halfway between CA1-sp and the visible CA1-slm, 50-150 um from the pyramidal cell layer
      nuclei fluorescence. A perpendicular lift-out (60 um X x 30 um Y target) was excavated at 25 degree
      stage tilt with a long rear trench (60 x 150-200 x 5-6 um) and a shorter, deeper front trench (60
      x 40-60 x 6-11 um); side cuts (15 nA, 4 um patterns) and undercuts (6-8 um tall) were made at 8-15
      degree stage rotation, and the chunk was attached to an EasyLift copper-block adapter by redeposition
      welding. Serial 3-5 um sections (1-4 nA line patterns, 1 nA preferred) were deposited onto 400 x
      100 mesh TEM support grids and welded (3 x 0.8 um patterns, ~4 um periodicity, 6-8 welds per section)
      before a ~70 s GIS protective layer. Lamellae were fine-milled on an Arctis PFIB (AutoTEM Cryo)
      with Xe plasma - 15-18 um wide, rough 4 nA to ~4-6 um, medium 1 nA to ~1.4-2 um, fine 0.1 nA to
      400-600 nm - and manually polished with argon plasma at 60 pA / 20 pA to ~150-300 nm final thickness.
    sample_preparation: Native brain tissue from an adult C57BL/6J mouse (Jackson Labs; 184 days old,
      male). After Schedule 1 euthanasia by intraperitoneal pentobarbital overdose, the cerebellum was
      removed, the hemispheres separated at the longitudinal fissure, and the left hemisphere was cut
      into 100 um sagittal slices on a Leica VT1200S vibratome (0.7 mm/s, 1 mm amplitude) in ice-cold
      dissection medium (99% HBSS, 0.035% ascorbic acid, 0.002% ATP, 1% penicillin/streptomycin, pH 7.1).
      Each hippocampus was isolated with curved teasing needles and held in Hibernate-A with 2% B-27 on
      ice. Slices were stained with Hoechst 33342 for 5 min, excised with a 2 mm biopsy punch, incubated
      for 20 min at room temperature in 10% dextran / 5% sucrose / 5% ethylene glycol in artificial CSF
      (pH 7.4), mounted in the 0.1 mm recess of a 3 mm type A gold-plated copper carrier, and vitrified
      by high-pressure freezing within a 1.5-4 h postmortem window.
    other_setup: Cryo-FIB serial lift-out; cryo-CLEM; high-pressure freezing
    cross_references:
      publications: 10.1016/j.crmeth.2025.101080, 10.1101/2024.10.14.617844
      related_database_entries: EMPIAR-13302
