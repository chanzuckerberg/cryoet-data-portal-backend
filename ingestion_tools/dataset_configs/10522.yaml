    dataset_identifier: 10522
    dataset_title: Cryo-FIB-milled NIH/3T3 mouse fibroblasts (dataset 2)
    dataset_description: Cryo-electron tomograms of cryo-FIB-milled lamellae through intact, plunge-frozen
      NIH/3T3 mouse embryonic fibroblasts, targeting the nucleus and nuclear periphery. The tomograms
      resolve the nuclear envelope, ribosomes and densely packed native chromatin.
