      grant_id: RP220582
    - funding_agency_name: National Institute of General Medical Sciences
      grant_id: U24 GM129539
    grid_preparation: Cells were seeded on glow-discharged carbon-coated Quantifoil R1/4 gold 200-mesh
      grids, manually blotted with filter paper and plunge-frozen in a liquid ethane/propane mixture using
      a custom-built vitrification device. Lamellae were prepared on an Aquilos 2 cryo-FIB/SEM by automated
      rough-to-fine milling followed by manual polishing with a 0.5 degree overtilt, targeting a nominal
      thickness of 150 nm.
    sample_preparation: NIH/3T3 mouse embryonic fibroblasts (ATCC CRL-1658) were grown at 37 C in 5% CO2
      in Dulbecco's Modified Eagle Medium with fetal calf serum, then seeded onto EM grids and cultured
      for a further two hours so the cells adhered stably to the support film. The line carries a modified
      nesprin protein tagged with mNeonGreen2, introduced by lentiviral insertion. Cells were treated
      with 100 nM jasplakinolide for a further two hours before vitrification.
    other_setup: 'Cryo-FIB milling, Cell strain: NIH3T3-mN2G, jasplakinolide treatment'
