annotations:
- metadata:
    annotation_ingest_id: virus-like-capsid-refined-10519
    annotation_method: Oriented PP7 VLP positions from RELION 5 subtomogram averaging with I2 symmetry, run with the py2rely STA pipeline. To balance the number of particles across three sessions, a random subset of 13,604 of the 15,411 curated candidates on ice were selected and then aligned to a PP7 VLP reference map at 9.6, 3.2, and 1.6 Å/px with repeated rounds of CTF refinement, Bayesian polishing, re-extraction and 3D auto-refinement. Deposited values are those of the particle set that gave the best map (3.6 Å at FSC 0.143), reached after 3D refinement after the third polishing round. Orientations are relative to the I2 reference and are defined up to the icosahedral symmetry. Averaging included three tomograms that are not part of this dataset, so 13,093 of the 13,247 refined particles are deposited. Six particles whose refined centre lies outside the reconstructed volume were omitted.
    annotation_object:
      id: GO:0170047
      name: virus-like capsid
      description: PP7 bacteriophage virus-like particle (VLP) capsid overexpressed in E. coli
    annotation_software: Octopi, slabpick, RELION 5.0.0, py2rely 0.7.0, DenoisET, copick
    authors: &authors
