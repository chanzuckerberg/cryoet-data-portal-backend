datasets:
- metadata:
    assay:
      id: EFO:0002909
      name: microscopy assay
    authors: *authors
    cell_component:
      id: GO:0170047
      name: virus-like capsid
    cell_strain:
      id: NCBITaxon:469008
      name: Escherichia coli BL21(DE3)
    cell_type:
      id: CL:0000520
      name: prokaryotic cell
    dataset_description:
      "Escherichia coli cells overexpressing PP7 virus-like particles imaged on a Titan Krios G4 with the crossed laser
       phase plate (xLPP) switched on, at 2-3 µm target defocus, as part of a matched-grid comparison with conventional
       defocus phase contrast. Dose-symmetric tilt series (nominally ±45°, 3° steps, ~126 e/Å² total; a few series
       stopped early) were collected using PACEtomo-based SerialEM scripts with electron-to-laser
       alignments for each tilt on a Gatan Celtic detector and processed with AreTomo3
       (motion correction, CTF estimation with additional phase shift, patch-based alignment, SART and WBP
       reconstruction); PP7 VLP positions were picked with Octopi, curated by 2D classification
       or picked manually."
    dataset_identifier: 10519
    dataset_title: "PP7 virus-like particles in E. coli imaged with the crossed laser phase plate (xLPP) at 2-3 µm
     defocus"
    dates: *dates
    development_stage:
      id: unknown
      name: unknown
    disease:
      id: PATO:0000461
      name: normal
    funding:
    - funding_agency_name: Chan Zuckerberg Initiative
      grant_id: CZII-2023-327779
    grid_preparation: "Quantifoil R 2/1 Au 200 mesh grids glow discharged in a Pelco easiGlow (15 mA, 45 s); 4 µL of
     cell suspension applied, blotted for 4 s and plunge frozen in liquid ethane with a Leica GP2 (90% humidity,
     4 °C chamber). All three datasets of this deposition were collected from the same grid."
    organism:
      name: Escherichia coli
      taxonomy_id: 562
    other_setup: Crossed laser phase plate (xLPP)
    sample_preparation: "E. coli BL21(DE3) carrying PP7-dimer expression plasmids grown in LB broth to OD600 0.6 and
     induced with IPTG to overexpress PP7 virus-like particles; cell pellets collected by centrifugation and stored;
     before freezing a pellet was resuspended in LB broth and adjusted to OD600 0.6, a concentration that yields a thin
     cell monolayer imageable without focused-ion-beam milling."
    sample_type: primary_cell_culture
    tissue:
      id: CL:0000520
      name: prokaryotic cell
  sources:
  - literal:
      value:
      - '10519'
