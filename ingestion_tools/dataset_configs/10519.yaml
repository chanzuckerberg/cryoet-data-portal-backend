- metadata:
    annotation_ingest_id: virus-like-capsid-curated-10519
    annotation_method: PP7 VLP candidates predicted with Octopi (3D U-Net segmentation with watershed localization) on DenoisET-denoised tomograms at 10 Å; 2D minislab projections of every candidate were extracted with slabpick, classified into 50 2D classes in RELION 5 via py2rely, classes showing intact VLPs were selected interactively and the retained candidates mapped back to the tomograms; subtomogram averaging started from this curated set (see the RELION-refined annotation).
    annotation_object:
      id: GO:0170047
      name: virus-like capsid
      description: PP7 bacteriophage virus-like particle (VLP) capsid overexpressed in E. coli
    annotation_software: Octopi, slabpick, RELION 5, py2rely, DenoisET, copick
    authors: *authors
