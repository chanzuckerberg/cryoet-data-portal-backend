name: Build and upload reservation lambda

on:
  push:
    branches:
      - main
    paths:
      - "ingestion_tools/scripts/reservation/lambda_function.py"
      - ".github/workflows/reservation-build.yaml"
  workflow_dispatch:

# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
permissions:
  id-token: write
  contents: read

# Don't let two deploys upload at once.
concurrency:
  group: reservation-lambda-deploy
  cancel-in-progress: false

jobs:
  upload-zip:
    name: build and upload reservation lambda zip to S3
    runs-on: ubuntu-latest
    if: github.repository == 'chanzuckerberg/cryoet-data-portal-backend' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          mask-aws-account-id: true
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::908710317728:role/cryoetportal-reservation-lambda-deploy
          role-duration-seconds: 1200
      - name: Package and upload lambda zip
        working-directory: ingestion_tools/scripts/reservation
        env:
          S3_BUCKET: cryoetportal-biohub-hpc-globus
        run: |
          python3 -m py_compile lambda_function.py
          zip -X reservation_lambda.zip lambda_function.py
          zip -T reservation_lambda.zip
          key="SUBMISSION_METADATA/lambda/reservation_lambda-${GITHUB_SHA}.zip"
          aws s3 cp reservation_lambda.zip "s3://${S3_BUCKET}/${key}"
          {
            echo "Uploaded reservation lambda zip. In cryoet-infra \`reservation.tf\`, set and apply:"
            echo '```'
            echo "lambda_zip_key = \"${key}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
